name: local-gateway

services:
  gateway:
    image: traefik:v3.7.8@sha256:4299bbed850421258fc5448c2e0e6ad350981d4d335a68de11b92448aedbefe5
    command:
      - --entrypoints.web.address=:80
      - --ping=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=local-gateway
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    labels:
      local-gateway: "true"
      local-gateway.version: "0.4.0"
    ports:
      - "127.0.0.1:80:80"
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - local-gateway

  database-router:
    image: "${LOCAL_DEVELOPMENT_GATEWAY_IMAGE:-ghcr.io/icefoganalytics/local-development-gateway/database-router:0.4.0@sha256:df15d59030cb839c89899075033b7b54e62772f88d4d7eb470f452038f447ec4}"
    healthcheck:
      test:
        - CMD
        - ruby
        - -rsocket
        - -e
        - |
          TCPSocket.new("127.0.0.1", 1433).close
          TCPSocket.new("127.0.0.1", 5432).close
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    labels:
      local-gateway: "true"
      local-gateway.version: "0.4.0"
    ports:
      - "127.0.0.1:1433:1433"
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - local-gateway

networks:
  local-gateway:
    name: local-gateway
