name: gateway-example-shared

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: example_admin
      POSTGRES_PASSWORD: Example-Postgres-Admin9!
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-postgres
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U example_admin -d postgres
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 5s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Example-Sql-Admin9!
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      default:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-sqlserver
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  provision-postgres:
    image: postgres:17-alpine
    profiles: [setup]
    environment:
      CHECKOUT_NAME: ${CHECKOUT_NAME:-}
      PGHOST: postgres
      PGUSER: example_admin
      PGPASSWORD: Example-Postgres-Admin9!
      PGDATABASE: postgres
    volumes:
      - ./postgres-role.sql:/setup/role.sql:ro
      - ./postgres-database.sql:/setup/database.sql:ro
    entrypoint: [bash, -euc]
    command:
      - |
        if [[ ! "$$CHECKOUT_NAME" =~ ^[a-z][a-z0-9_]{0,31}$$ ]]; then
          echo "Set CHECKOUT_NAME to the checkout's Compose project name" >&2
          exit 1
        fi

        for environment in development test; do
          name="app_$${CHECKOUT_NAME}_$$environment"
          psql -X -v ON_ERROR_STOP=1 \
            -v "role=$$name" -v "password=Example-$$name-Only9!" \
            -f /setup/role.sql
          psql -X -v ON_ERROR_STOP=1 \
            -v "database=$$name" -f /setup/database.sql
        done

  provision-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    profiles: [setup]
    environment:
      CHECKOUT_NAME: ${CHECKOUT_NAME:-}
      SQLCMDPASSWORD: Example-Sql-Admin9!
    volumes:
      - ./sqlserver-login.sql:/setup/login.sql:ro
      - ./sqlserver-database.sql:/setup/database.sql:ro
    entrypoint: [bash, -euc]
    command:
      - |
        if [[ ! "$$CHECKOUT_NAME" =~ ^[a-z][a-z0-9_]{0,31}$$ ]]; then
          echo "Set CHECKOUT_NAME to the checkout's Compose project name" >&2
          exit 1
        fi

        for environment in development test; do
          name="app_$${CHECKOUT_NAME}_$$environment"
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -d master -C -b \
            -v "database=$$name" "password=Example-$$name-Only9!" \
            -i /setup/login.sql
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -d master -C -b \
            -v "database=$$name" -i /setup/database.sql
        done

volumes:
  postgres-data: {}
  sqlserver-data: {}
