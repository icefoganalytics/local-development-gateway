name: gateway-example-shared

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: example_admin
      POSTGRES_PASSWORD: Example-Postgres-Admin9!
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-postgres
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U example_admin -d postgres
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 5s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Example-Sql-Admin9!
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      default:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-sqlserver
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  provision-postgres:
    image: postgres:17-alpine
    profiles: [setup]
    environment:
      CHECKOUT_NAME: ${CHECKOUT_NAME:-}
      PGHOST: postgres
      PGUSER: example_admin
      PGPASSWORD: Example-Postgres-Admin9!
      PGDATABASE: postgres
    volumes:
      - ./provisioning/checkout.sh:/setup/checkout.sh:ro
      - ./provisioning/postgres:/adapter:ro
    entrypoint: [bash, /setup/checkout.sh]

  provision-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    profiles: [setup]
    environment:
      CHECKOUT_NAME: ${CHECKOUT_NAME:-}
      SQLCMDPASSWORD: Example-Sql-Admin9!
    volumes:
      - ./provisioning/checkout.sh:/setup/checkout.sh:ro
      - ./provisioning/sqlserver:/adapter:ro
    entrypoint: [bash, /setup/checkout.sh]

volumes:
  postgres-data: {}
  sqlserver-data: {}
