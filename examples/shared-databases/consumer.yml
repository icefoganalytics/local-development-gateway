x-application: &application
  build: ./app
  environment: &development
    DB_ENGINE: ${DB_ENGINE:-sqlserver}
    APP_HOST: app-${CHECKOUT_NAME:?use bin/dev}
    DB_HOST: ${DB_SERVER_PROJECT:-gateway-example-shared}-${DB_ENGINE:-sqlserver}
    DB_NAME: app_${CHECKOUT_NAME:?use bin/dev}_development
    DB_USER: app_${CHECKOUT_NAME:?use bin/dev}_development
    DB_PASSWORD: Example-app_${CHECKOUT_NAME:?use bin/dev}_development-Only9!
  networks:
    - default
    - database

services:
  app:
    <<: *application
    networks:
      default:
        aliases:
          - app-${CHECKOUT_NAME:?use bin/dev}
      database: {}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          fetch("http://localhost:3000/notes")
            .then((response) => {
              if (!response.ok) {
                process.exit(1)
              }

              process.exit(0)
            })
            .catch((error) => {
              console.error(error)
              process.exit(1)
            })
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  test_app:
    <<: *application
    profiles: [test]
    command: [npm, test]
    environment:
      <<: *development
      DB_NAME: app_${CHECKOUT_NAME:?use bin/dev}_test
      DB_USER: app_${CHECKOUT_NAME:?use bin/dev}_test
      DB_PASSWORD: Example-app_${CHECKOUT_NAME:?use bin/dev}_test-Only9!

  lint:
    build: ./app
    profiles: [checks]
    network_mode: none
    command: [npm, run, lint]

networks:
  database:
    external: true
    name: ${DB_SERVER_PROJECT:-gateway-example-shared}_default
