services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: development-only
      POSTGRES_DB: app_development
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - "${POSTGRES_HOST:?run compose.rb}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example -d app_development"]
      interval: 2s
      timeout: 2s
      retries: 30

  db_reporting:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Example-Only_Strong9!"
    volumes:
      - reporting-data:/var/opt/mssql
    networks:
      default:
        aliases:
          - "${REPORTING_HOST:?run compose.rb}"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db_archive:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Example-Only_Strong9!"
    volumes:
      - archive-data:/var/opt/mssql
    networks:
      default:
        aliases:
          - "${ARCHIVE_HOST:?run compose.rb}"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres_client:
    image: postgres:17-alpine
    profiles: [clients]
    entrypoint: ["psql"]
    command: []
    environment:
      PGHOST: "${POSTGRES_HOST:?run compose.rb}"
      PGPORT: "5432"
      PGUSER: example
      PGPASSWORD: development-only
      PGDATABASE: app_development
    networks:
      default: {}

  reporting_client:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    profiles: [clients]
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-C", "-b"]
    command: []
    environment:
      SQLCMDSERVER: "tcp:${REPORTING_HOST:?run compose.rb},1433"
      SQLCMDUSER: sa
      SQLCMDPASSWORD: "Example-Only_Strong9!"
      SQLCMDDBNAME: master
    networks:
      default: {}

  archive_client:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    profiles: [clients]
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-C", "-b"]
    command: []
    environment:
      SQLCMDSERVER: "tcp:${ARCHIVE_HOST:?run compose.rb},1433"
      SQLCMDUSER: sa
      SQLCMDPASSWORD: "Example-Only_Strong9!"
      SQLCMDDBNAME: master
    networks:
      default: {}

volumes:
  postgres-data: {}
  reporting-data: {}
  archive-data: {}
