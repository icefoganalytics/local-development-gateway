services:
  db:
    networks:
      default: {}
      local-gateway: {}
    labels:
      local-gateway.tcp.driver: postgresql
      local-gateway.tcp.hostname: "db.${GATEWAY_HOSTNAME:?set a unique checkout-derived GATEWAY_HOSTNAME}"
      local-gateway.tcp.port: "5432"

  db_trav_com:
    networks:
      default: {}
      local-gateway: {}
    labels:
      local-gateway.tcp.driver: postgresql
      local-gateway.tcp.hostname: "secondary-db.${GATEWAY_HOSTNAME:?set a unique checkout-derived GATEWAY_HOSTNAME}"
      local-gateway.tcp.port: "5432"

  api:
    networks:
      default: {}
      local-gateway: {}

  jobs:
    networks:
      default: {}
      local-gateway: {}

  test_api:
    networks:
      default: {}
      local-gateway: {}

networks:
  local-gateway:
    external: true
    name: local-gateway
