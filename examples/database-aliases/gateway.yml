services:
  db:
    networks:
      default: {}
      local-gateway: {}
    labels:
      local-gateway.tcp.driver: postgresql
      local-gateway.tcp.hostname: "db.${GATEWAY_HOSTNAME:?set a unique checkout-derived GATEWAY_HOSTNAME}"
      local-gateway.tcp.port: "5432"

  db_reporting:
    networks:
      default: {}
      local-gateway: {}
    labels:
      local-gateway.tcp.driver: sql_server
      local-gateway.tcp.hostname: "reporting.${GATEWAY_HOSTNAME:?set a unique checkout-derived GATEWAY_HOSTNAME}"
      local-gateway.tcp.port: "1433"

  db_archive:
    networks:
      default: {}
      local-gateway: {}
    labels:
      local-gateway.tcp.driver: sql_server
      local-gateway.tcp.hostname: "archive.${GATEWAY_HOSTNAME:?set a unique checkout-derived GATEWAY_HOSTNAME}"
      local-gateway.tcp.port: "1433"

networks:
  local-gateway:
    external: true
    name: local-gateway
